<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上電子簽名</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 15px; text-align: center; background-color: #f4f7f6; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        canvas { border: 2px dashed #888; border-radius: 4px; background-color: #fff; cursor: crosshair; touch-action: none; }
        .btn-group { margin-top: 15px; }
        button { padding: 10px 20px; font-size: 16px; border: none; border-radius: 4px; cursor: pointer; margin: 0 5px; }
        .btn-clear { background-color: #ff4d4d; color: white; }
        .btn-submit { background-color: #4CAF50; color: white; }
        #statusMessage { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>線上電子簽名</h2>

    <div class="form-group">
        <label for="userName">簽名者姓名：</label>
        <input type="text" id="userName" placeholder="請輸入姓名" required>
    </div>

    <div class="form-group">
        <label>請在下方框內簽名：</label>
        <canvas id="signatureCanvas" width="450" height="200"></canvas>
    </div>

    <div class="btn-group">
        <button class="btn-clear" onclick="clearCanvas()">清除重簽</button>
        <button class="btn-submit" onclick="submitSignature()">確認送出</button>
    </div>

    <div id="statusMessage"></div>

    <script>
        // 🚨 請替換為步驟二獲得的 GAS Web App URL
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxGPsNrMTu8siIXVpJ9LQ7QZs1ISdCdRsCbMpWypp4HxjhM2fSKCM9JQq5QEhAgHCu8IQ/exec";

        const canvas = document.getElementById('signatureCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 3;
        ctx.lineCap = "round";

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX, clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startDrawing(e) { isDrawing = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); }
        function draw(e) { if (!isDrawing) return; e.preventDefault(); const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); }
        function stopDrawing() { isDrawing = false; }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('statusMessage').innerText = "";
        }

        function submitSignature() {
            const nameInput = document.getElementById('userName').value.trim();
            const statusDiv = document.getElementById('statusMessage');

            if (!nameInput) { alert("請輸入姓名！"); return; }

            const imageData = canvas.toDataURL('image/png');
            statusDiv.style.color = "blue";
            statusDiv.innerText = "資料上傳中，請稍後...";

            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                contentType: 'application/json',
                body: JSON.stringify({ name: nameInput, image: imageData })
            })
            .then(response => response.json())
            .then(data => {
                if (data.result === "success") {
                    statusDiv.style.color = "green";
                    statusDiv.innerText = "簽名已成功送出！";
                    clearCanvas();
                    document.getElementById('userName').value = "";
                } else { throw new Error(data.message); }
            })
            .catch(error => {
                statusDiv.style.color = "red";
                statusDiv.innerText = "上傳失敗，請稍後再試。";
            });
        }
    </script>
</body>
</html>
